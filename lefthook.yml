# Lefthook — blocks every commit and push unless quality gates pass.
#
# Install: npm install && npx lefthook install
# Manual:  npm run verify
#
# The pre-commit hygiene gate is the last cheap moment to stop a binary or a
# secret from entering git history. Once pushed, it is there forever.
# Never bypass with --no-verify.

output:
  - failure
  - summary

pre-commit:
  parallel: false
  commands:
    hygiene:
      # Staged scope: fast, and catches the file before it becomes an object.
      run: python3 scripts/check_repo_hygiene.py --staged
      skip:
        - merge
        - rebase
    quality:
      run: bash scripts/check-quality.sh --staged
      skip:
        - merge
        - rebase

pre-push:
  commands:
    quality:
      run: bash scripts/check-quality.sh --all
