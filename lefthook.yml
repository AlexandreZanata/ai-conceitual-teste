# Lefthook — blocks every commit (local included) unless quality gates pass.
# Caps: cyclomatic ≤10 (file/function line caps waived), lint 0/0, system 0 errors.
#
# Install: npm install && npx lefthook install
# Manual:  npm run verify

output:
  - failure

pre-commit:
  parallel: false
  commands:
    quality:
      run: bash scripts/check-quality.sh
      skip:
        - merge
        - rebase

pre-push:
  commands:
    quality:
      run: bash scripts/check-quality.sh
