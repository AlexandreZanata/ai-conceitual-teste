<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvoGen metrics</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e7ecf1;
      --muted: #8b9aab;
      --accent: #3d9a7a;
      --line: #243040;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2a32, var(--bg));
      color: var(--fg);
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 { font-weight: 600; letter-spacing: 0.04em; margin: 0 0 0.25rem; }
    p { color: var(--muted); margin: 0 0 1.25rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    input, select, button {
      font: inherit;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #151c24;
      color: var(--fg);
    }
    button { background: var(--accent); border-color: transparent; cursor: pointer; }
    button.secondary { background: #243040; }
    #status { color: var(--muted); margin-bottom: 1rem; }
    canvas { max-width: 960px; background: #121820; border: 1px solid var(--line); padding: 0.5rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <h1>EvoGen</h1>
  <p>Live fitness stream (UC-003). Chart.js MIT — see THIRD_PARTY_NOTICES.md.</p>
  <div class="row">
    <select id="condition">
      <option value="A">A genetic</option>
      <option value="B">B direct</option>
      <option value="C" selected>C full</option>
    </select>
    <input id="seed" type="number" value="42" title="seed" />
    <input id="gens" type="number" value="30" title="max generations" />
    <button id="start">Start</button>
    <button id="pause" class="secondary">Pause</button>
    <button id="resume" class="secondary">Resume</button>
    <button id="stop" class="secondary">Stop</button>
  </div>
  <div id="status">idle</div>
  <canvas id="chart" width="900" height="360"></canvas>
  <script src="/app.js"></script>
</body>
</html>
